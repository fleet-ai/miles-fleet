name: Build Fleet Trainer

on:
  push:
    branches:
      - glm53-bu
      - main
    paths:
      - "**"
      - "!examples/fleet/launch/default-image.txt"
  pull_request:
    branches:
      - glm53-bu
      - main
    paths:
      - "**"
      - "!examples/fleet/launch/default-image.txt"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fleet/miles-trainer
  ECR_CACHE_REPOSITORY: fleet/miles-trainer-cache

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate or publish Fleet trainer image
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["docker-build"]') }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Miles
        uses: actions/checkout@v7

      - name: Start the platform deploy-key agent
        if: github.event_name != 'pull_request'
        env:
          PLATFORM_DEPLOY_KEY: ${{ secrets.FLEET_PLATFORM_DEPLOY_KEY }}
        run: |
          if [ -z "$PLATFORM_DEPLOY_KEY" ]; then
            echo "::error::FLEET_PLATFORM_DEPLOY_KEY is not configured"
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/miles-trainer-ssh"
          printf '%s\n' "$PLATFORM_DEPLOY_KEY" > "$RUNNER_TEMP/miles-trainer-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/miles-trainer-ssh/id_ed25519"
          ssh-agent -a "$RUNNER_TEMP/miles-trainer-ssh/agent.sock" > "$RUNNER_TEMP/miles-trainer-ssh/agent.env"
          sed -n 's/^SSH_AGENT_PID=\([^;]*\).*/SSH_AGENT_PID=\1/p' "$RUNNER_TEMP/miles-trainer-ssh/agent.env" >> "$GITHUB_ENV"
          echo "SSH_AUTH_SOCK=$RUNNER_TEMP/miles-trainer-ssh/agent.sock" >> "$GITHUB_ENV"
          SSH_AUTH_SOCK="$RUNNER_TEMP/miles-trainer-ssh/agent.sock" ssh-add "$RUNNER_TEMP/miles-trainer-ssh/id_ed25519"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::661864827319:role/github-actions-miles-trainer-ecr-role
          role-session-name: GitHubActionsMilesTrainer
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Select image identity
        id: image
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "tag=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "uri=miles-trainer:$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for an existing trusted image
        if: github.event_name != 'pull_request'
        id: existing_image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          if aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the pull request Dockerfile
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build \
            --check \
            --platform linux/amd64 \
            --file examples/fleet/launch/Dockerfile \
            .

      - name: Build and push the trusted image
        if: github.event_name != 'pull_request' && steps.existing_image.outputs.exists != 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file examples/fleet/launch/Dockerfile \
            --ssh default \
            --cache-from "type=registry,ref=$ECR_REGISTRY/${{ env.ECR_CACHE_REPOSITORY }}:buildcache" \
            --cache-to "type=registry,ref=$ECR_REGISTRY/${{ env.ECR_CACHE_REPOSITORY }}:buildcache,mode=max" \
            --tag "$IMAGE_URI" \
            --push \
            .

      - name: Record the ECR digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          IMAGE_JSON=$(aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --region "${{ env.AWS_REGION }}" \
            --output json)
          DIGEST=$(printf '%s' "$IMAGE_JSON" | jq -r '.imageDetails[0].imageDigest')
          SIZE_BYTES=$(printf '%s' "$IMAGE_JSON" | jq -r '.imageDetails[0].imageSizeInBytes')
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@$DIGEST"
          {
            echo "### Fleet trainer image"
            echo
            echo "- Source commit: \`${{ github.sha }}\`"
            echo "- Runtime image: \`$IMAGE\`"
            echo "- Compressed size: \`$SIZE_BYTES\` bytes"
            echo
            echo "Update \`examples/fleet/launch/default-image.txt\` in a reviewed pull request."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the platform deploy key
        if: always()
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            ssh-agent -k >/dev/null
          fi
          rm -rf "$RUNNER_TEMP/miles-trainer-ssh"
